name: HQGlobalMesh
options:
  bundleIdPrefix: hq.mesh
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: 15.0

targets:
  HQGlobalMesh:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    info:
      plist:
        CFBundleDisplayName: "HQ Mesh"
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: "black"
        NSBluetoothAlwaysUsageDescription: "Доступ к Bluetooth необходим для поиска узлов Империи в режиме оффлайн."
        NSLocalNetworkUsageDescription: "Локальная сеть используется для прямой передачи зашифрованных данных."
        UIBackgroundModes:
          - bluetooth-peripheral
          - fetch
    sources:
      - Core
      - Models
      - Services
      - Views
