name: HQGlobalMesh
options:
  bundleIdPrefix: com.hq.global
targets:
  HQGlobalMesh:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: . # Собираем всё, что видим в корне и папках
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: 5.9
    dependencies:
      - package: Firebase
    
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 10.0.0
