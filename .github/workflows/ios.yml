name: HQ Empire Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Auto-Select Latest Xcode 🎯
      run: |
        # Ищем все Xcodes, сортируем по версии и берем самый последний
        LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
        echo "🔥 Найден новейший компилятор: $LATEST_XCODE"
        sudo xcode-select -s "$LATEST_XCODE"

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Project
      run: xcodegen generate

    - name: Build Application
      run: |
        xcodebuild build \
          -project HQGlobalMesh.xcodeproj \
          -scheme HQGlobalMesh \
          -destination 'generic/platform=iOS' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
