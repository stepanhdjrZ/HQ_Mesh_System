name: HQ Empire Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Auto-Select Latest Xcode 🎯
      run: |
        LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
        echo "🔥 Найден новейший компилятор: $LATEST_XCODE"
        sudo xcode-select -s "$LATEST_XCODE"

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Project
      run: xcodegen generate

    - name: Build Application
      run: |
        xcodebuild build \
          -project HQGlobalMesh.xcodeproj \
          -scheme HQGlobalMesh \
          -destination 'generic/platform=iOS' \
          -configuration Debug \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Package to IPA 📦
      run: |
        # Робот сам создает правильную структуру для 3uTools
        mkdir -p Payload
        cp -r build/Build/Products/Debug-iphoneos/*.app Payload/
        zip -qr HQ-Mesh-System.ipa Payload

    - name: Upload Build Artifacts 🚀
      uses: actions/upload-artifact@v4
      with:
        name: HQ-Mesh-System-IPA
        # Теперь Гитхаб отдаст тебе ровно один готовый файл
        path: HQ-Mesh-System.ipa
        if-no-files-found: error
