name: HQ Empire Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Project
      run: xcodegen generate

    - name: Fetch Dependencies
      run: xcodebuild -resolvePackageDependencies -project HQGlobalMesh.xcodeproj -scheme HQGlobalMesh

    - name: Compile Application
      run: |
        xcodebuild build \
          -project HQGlobalMesh.xcodeproj \
          -scheme HQGlobalMesh \
          -destination 'generic/platform=iOS' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
