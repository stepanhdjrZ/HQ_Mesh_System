name: Build HQ God Mode (App Store Ready)
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          xcrun --sdk iphoneos swiftc \
          HQApp.swift Models/Models.swift Services/MeshNetworkManager.swift \
          Views/ContentView.swift Views/ChatView.swift Views/QRScannerView.swift \
          Views/SettingsView.swift Views/AuthView.swift \
          -target arm64-apple-ios17.0 -sdk $(xcrun --show-sdk-path --sdk iphoneos) \
          -swift-version 5 -parse-as-library -framework SwiftUI -framework UIKit \
          -framework AVFoundation -framework CoreImage -framework CoreBluetooth \
          -emit-executable -o Messenger
      - name: Assemble
        run: |
          mkdir -p Payload/Messenger.app
          mv Messenger Payload/Messenger.app/
          cat <<EOF > Payload/Messenger.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>Messenger</string>
          <key>CFBundleIdentifier</key><string>com.hq.globalmesh</string>
          <key>CFBundleName</key><string>HQ Global</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>9.5</string>
          <key>MinimumOSVersion</key><string>17.0</string>
          <key>NSCameraUsageDescription</key><string>Необходимо для сканирования QR-кодов узлов.</string>
          <key>NSBluetoothAlwaysUsageDescription</key><string>Используется для передачи сообщений в режиме Mesh без интернета.</string>
          <key>NSLocalNetworkUsageDescription</key><string>Используется для поиска ближайших узлов HQ в вашей сети.</string>
          <key>NSMicrophoneUsageDescription</key><string>Необходимо для записи голосовых сообщений.</string>
          </dict></plist>
          EOF
          zip -r Messenger.ipa Payload
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HQ-PRO-v9-5-RELEASE
          path: Messenger.ipa
