name: Build Hybrid HQ
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile App
        run: |
          xcrun --sdk iphoneos swiftc ContentView.swift \
            -target arm64-apple-ios17.0 \
            -sdk $(xcrun --show-sdk-path --sdk iphoneos) \
            -swift-version 5 \
            -parse-as-library \
            -framework SwiftUI \
            -framework UIKit \
            -emit-executable -o Messenger

      - name: Generate Info.plist & Assemble
        run: |
          mkdir -p Payload/Messenger.app
          mv Messenger Payload/Messenger.app/
          
          # Бронебойный генератор конфига (не боится пробелов)
          echo '<?xml version="1.0" encoding="UTF-8"?>' > Payload/Messenger.app/Info.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> Payload/Messenger.app/Info.plist
          echo '<plist version="1.0"><dict>' >> Payload/Messenger.app/Info.plist
          echo '<key>CFBundleExecutable</key><string>Messenger</string>' >> Payload/Messenger.app/Info.plist
          echo '<key>CFBundleIdentifier</key><string>com.hq.globalmesh</string>' >> Payload/Messenger.app/Info.plist
          echo '<key>CFBundleName</key><string>HQ Global</string>' >> Payload/Messenger.app/Info.plist
          echo '<key>CFBundleDisplayName</key><string>HQ Global</string>' >> Payload/Messenger.app/Info.plist
          echo '<key>MinimumOSVersion</key><string>17.0</string>' >> Payload/Messenger.app/Info.plist
          
          # ФИКС ПОЛНОГО ЭКРАНА
          echo '<key>UILaunchScreen</key><dict/>' >> Payload/Messenger.app/Info.plist
          
          # ДОСТУП К СЕТИ В ФОНЕ
          echo '<key>NSLocalNetworkUsageDescription</key><string>Требуется для поиска узлов сети</string>' >> Payload/Messenger.app/Info.plist
          echo '<key>NSBonjourServices</key><array><string>_hq-mesh._tcp</string><string>_hq-mesh._udp</string></array>' >> Payload/Messenger.app/Info.plist
          echo '</dict></plist>' >> Payload/Messenger.app/Info.plist
          
          # Вшиваем иконку, если она есть
          if [ -f "icon.png" ]; then
            cp icon.png Payload/Messenger.app/AppIcon.png
            sed -i '' 's/<\/dict>/<key>CFBundleIconFiles<\/key><array><string>AppIcon<\/string><\/array><\/dict>/' Payload/Messenger.app/Info.plist
          fi
          
          zip -r Messenger.ipa Payload
          
      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hybrid-HQ-App
          path: Messenger.ipa
