name: Build Pure IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile App
        run: |
          # Собираем оба файла в один исполняемый файл
          xcrun --sdk iphoneos swiftc ContentView.swift App.swift \
            -target arm64-apple-ios17.0 \
            -sdk $(xcrun --show-sdk-path --sdk iphoneos) \
            -emit-executable \
            -o Messenger

      - name: Assemble IPA Bundle
        run: |
          # Создаем структуру папок, которую понимает iOS
          mkdir -p Payload/Messenger.app
          mv Messenger Payload/Messenger.app/
          cp Info.plist Payload/Messenger.app/
          # Запаковываем в финальный IPA
          zip -r Messenger.ipa Payload
          
      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-App
          path: Messenger.ipa
