name: Build OTA Enabled Mesh
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile App
        run: |
          xcrun --sdk iphoneos swiftc ContentView.swift \
            -target arm64-apple-ios17.0 \
            -sdk $(xcrun --show-sdk-path --sdk iphoneos) \
            -swift-version 5 \
            -parse-as-library \
            -framework SwiftUI \
            -framework UIKit \
            -emit-executable -o Messenger

      - name: Generate OTA Config & Assemble
        run: |
          mkdir -p Payload/Messenger.app
          mv Messenger Payload/Messenger.app/
          
          # Создаем Info.plist с поддержкой OTA и фиксом экрана
          cat <<EOF > Payload/Messenger.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>Messenger</string>
              <key>CFBundleIdentifier</key><string>com.hq.globalmesh</string>
              <key>CFBundleName</key><string>HQ Global</string>
              <key>CFBundleDisplayName</key><string>HQ Global</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>6.5</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>17.0</string>
              <key>UILaunchScreen</key><dict/>
              <key>NSLocalNetworkUsageDescription</key><string>Mesh-сеть для связи</string>
              <key>NSBonjourServices</key><array><string>_hq-mesh._tcp</string><string>_hq-mesh._udp</string></array>
          </dict>
          </plist>
          EOF
          
          zip -r Messenger.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTA-Starter-Build
          path: Messenger.ipa
